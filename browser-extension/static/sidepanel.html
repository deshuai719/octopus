<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octopus 登录助手</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <header class="masthead">
        <div class="mark" aria-hidden="true">O</div>
        <div>
          <p class="eyebrow">DIRECT IMPORT PASS</p>
          <h1>Octopus 登录助手</h1>
        </div>
      </header>

      <section class="passport" aria-live="polite">
        <div class="rail" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="passport-body">
          <p id="status" class="status">正在读取当前页面</p>
          <p id="detail" class="detail">正在识别 Octopus 或中转站登录状态。</p>
          <div id="endpoints" class="endpoints" hidden>
            <div class="endpoint">
              <span>Octopus 页面</span>
              <code id="api-origin">—</code>
            </div>
            <div class="endpoint">
              <span>要登录的网站</span>
              <code id="target-origin">—</code>
            </div>
          </div>
          <div id="direct-preview" class="direct-preview" hidden>
            <div class="preview-row"><span>操作</span><strong id="capture-action">—</strong></div>
            <div class="preview-row"><span>凭据</span><code id="credential-mask">—</code></div>
            <div class="preview-row"><span>用户 ID</span><strong id="platform-user-id">—</strong></div>
            <div id="matched-site-row" class="preview-row" hidden><span>已匹配站点</span><strong id="matched-site">—</strong></div>
            <div id="matched-account-row" class="preview-row" hidden><span>已匹配账号</span><strong id="matched-account">—</strong></div>
            <label id="site-name-field" class="field" hidden>
              <span>站点名称</span>
              <input id="site-name" maxlength="128" autocomplete="off" />
            </label>
            <label id="account-name-field" class="field" hidden>
              <span>账号名称</span>
              <input id="account-name" maxlength="128" autocomplete="off" />
            </label>
            <label id="account-resolution-field" class="field" hidden>
              <span>选择已有管理账号</span>
              <select id="account-resolution"></select>
            </label>
            <label id="manual-token-field" class="field" hidden>
              <span>推荐访问令牌（仅用于本次提交）</span>
              <input id="manual-token" type="password" maxlength="16384" autocomplete="off" spellcheck="false" />
            </label>
            <button id="manual-token-action" class="secondary" hidden>使用此令牌继续</button>
            <p id="capture-warning" class="warning" hidden></p>
          </div>
        </div>
      </section>

      <div class="actions">
        <button id="primary-action" class="primary">读取当前标签页</button>
        <button id="secondary-action" class="secondary" hidden></button>
        <button id="copy-diagnostics" class="quiet">复制脱敏诊断</button>
        <button id="clear-diagnostics" class="quiet">清空诊断</button>
        <button id="discard" class="quiet">清理当前站点临时导入</button>
      </div>

      <footer>
        不读取密码 · 不绕过验证码 · 不保存 Cloudflare/WAF Cookie
      </footer>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
